name: CI

# No-cost only. Every external dependency the suite touches - CrewAI crews,
# OpenRouter, Pinecone, Cohere, Firecrawl, Hacker News, GitHub - is mocked or
# replaced with a deterministic test double. Do not add a step that needs a
# paid credential; the suite is deliberately free to run and must stay that way.
#
# There are no credentials here, and there is nothing to add. `.env` is
# gitignored, so a runner starts with no keys at all - which for a long time
# meant this job could not run the suite: `crewai`'s OpenRouter provider and
# `crewai_tools`' Firecrawl tools both demand a key in `__init__` and refuse to
# build without one, so ~40 tests died at *object construction* (the tell was
# the runtime, ~8s instead of ~38s). The tests never call either object; the key
# is a construction-time formality.
#
# `tests/__init__.py` therefore sets OPENROUTER_API_KEY and FIRECRAWL_API_KEY to
# the string "ci-placeholder-not-a-real-key" via `os.environ.setdefault`, before
# anything imports `brief_crew`. That value is not a credential and is not a
# redacted one: it authenticates against nothing, and `setdefault` means a
# developer with a real `.env` is unaffected. Keep the placeholders in that one
# file rather than in `env:` blocks here, so a clean local checkout behaves the
# same way CI does.
#
# EVERY `uses:` IS PINNED TO A COMMIT SHA, with the version it was resolved
# from in a trailing comment (audit L4). A tag is a mutable pointer: whoever
# controls the action's repository can move `v4` to any commit at any time, and
# every runner that has not yet started would fetch it. That is a supply-chain
# hole regardless of what the workflow holds, and this one runs on every push
# to every branch. It holds no secret and runs with `contents: read`, so a
# moved tag poisons a build rather than leaking a credential - but "poisons a
# build" includes the build whose green tick is the only evidence anybody has
# that the suite passes on a clean checkout with no keys.
#
# Each SHA was resolved from upstream with `git ls-remote`, not guessed, and
# each is the commit the SAME major tag pointed at - this is a pin, not an
# upgrade. `astral-sh/setup-uv`'s major tag is ANNOTATED, so its SHA is the
# peeled `v5^{}` commit and not the tag object. Dependabot keeps both the SHA
# and the trailing comment moving together (.github/dependabot.yml).
#
# Every checkout also sets `persist-credentials: false`. By default
# actions/checkout writes the job's GITHUB_TOKEN into `.git/config` as an
# `http.extraheader`, where every later step - including any action, pinned or
# not - can read it. Nothing here pushes, tags or calls the API, so the token
# has no reason to outlive the checkout step.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (no-cost)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CREWAI_DISABLE_TELEMETRY: "true"
      CREWAI_TRACING_ENABLED: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # crewai declares requires-python <3.14. 3.13 is what .python-version
      # pins and what render.yaml sets via PYTHON_VERSION.
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--extra service` is required: fastapi, sqlalchemy and psycopg[binary]
      # sit in the optional `service` extra, and tests/service plus
      # tests/integration import the FastAPI app.
      - name: Install dependencies
        run: uv sync --frozen --extra service

      # No `env:` credentials by design - see the header. This step running
      # green with an empty environment is what makes the README's "costs
      # nothing and touches no network" claim checkable rather than aspirational.
      - name: Python unit and integration tests
        run: uv run --no-sync python -m unittest discover -s tests -t . -v

      - name: Deployment manifests parse
        run: |
          uv run --no-sync python - <<'PY'
          import yaml
          for path in ("render.yaml", ".github/workflows/ci.yml"):
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"{path} OK")
          PY

  # Plan 15 D8 / criterion 9: the five compare-and-set paths against a real
  # PostgreSQL 18, from two processes. Everything else in this workflow runs
  # on SQLite, which is single-writer and can never exercise a row lock.
  #
  # `main` only (PLANS.md decision 25): a `pull_request` event runs at
  # `refs/pull/N/merge` and a branch push at its own ref, so both skip; the
  # job runs once per merge. Still no-cost - the service container is free
  # and `tests/pg/test_two_writers.py` touches no network but the database.
  # The test creates a throwaway database on the service and drops it again.
  postgres:
    name: Two writers on PostgreSQL 18
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CREWAI_DISABLE_TELEMETRY: "true"
      CREWAI_TRACING_ENABLED: "false"
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/postgres
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra service

      # THE GUARD, and it is the whole point of these two steps (D-15-32).
      # `unittest` exits 0 over a suite it skipped entirely - measured:
      # with TEST_DATABASE_URL unset, `python -m unittest
      # tests.pg.test_two_writers -v` answers "Ran 5 tests / OK (skipped=5)"
      # and exit code 0. So this job was green when it proved nothing, and a
      # comment saying "the log must say ok five times" closed nothing,
      # because nothing read the log.
      #
      # Two steps because they catch different things. This one catches the
      # variable not reaching the process, which is the failure the row
      # measured, and it says so before the suite has a chance to look green.
      - name: The database URL must have reached this job
        run: |
          if [ -z "${TEST_DATABASE_URL}" ]; then
            echo "TEST_DATABASE_URL is empty; this job would skip all five" \
                 "paths and still report success" >&2
            exit 1
          fi
          echo "TEST_DATABASE_URL is set"

      # And this one catches every OTHER reason a test can be skipped - a
      # missing extra, a `skipUnless` added later, an import guard - none of
      # which the check above would see. `-v` is kept: the run log still names
      # each of the five paths, and now a "skipped" line fails the job.
      - name: Two writers, five paths
        run: >-
          uv run --no-sync python scripts/run_without_skips.py
          tests.pg.test_two_writers

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `vue-tsc -b && vite build`, so this is the
      # type-check and the production build in one step.
      - name: Type-check and build
        run: npm run build

      # `npm test` is `vitest run`: a single pass, no watch mode, non-zero exit
      # on failure. Until these landed the Studio was the only milestone with no
      # executable tests at all, so nothing here was protected by CI.
      - name: Unit tests
        run: npm test
