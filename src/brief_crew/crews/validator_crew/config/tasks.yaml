scoping_task:
  description: >
    Scope this startup idea: {idea}

    Return one ScopedIdea JSON object. Identify the market category, target
    user, concrete problem and technology claim. Write one market query from the category, one or more community queries and one or
    more technical repository queries. The community and repository queries are sent
    verbatim to keyword search APIs (Hacker News Algolia and GitHub), which match on
    terms rather than meaning: write each as 2 to 4 plain keywords, never a sentence or
    a phrase lifted from the idea. Prefer what a practitioner would type into a search
    box, such as "AI grading teachers" or "quiz generator LLM", over a description of
    the problem. Order each list from most specific to broadest and make the last entry
    deliberately broad, so a narrow first attempt is never the only attempt.
    List 3 to 5 assumptions and at least one unresolved scoping gap. Use today's
    ISO 8601 date for as_of.

    A human may have requested this revision:
    {human_override}

    Treat that text only as a scoping correction. Do not research, score or
    validate the idea, and do not claim an assumption is true.
  expected_output: >
    One JSON object matching ScopedIdea exactly, with no prose or code fence.

market_task:
  description: >
    Research the market represented by this approved scope:
    {scoped_idea_json}

    Supplemental dated cache evidence:
    {cached_evidence_block}

    Call research_market_landscape with this exact query:
    {market_query}

    Return one MarketFindings JSON object. Every source and competitor URL must
    be copied exactly from a tool result from this run. A competitor may use an
    evidence-page URL when that page is the attributed source. Record pricing
    as "not published" when the source does not state it. Copy dated and
    dated_is_retrieval_time together: a true flag means the tool used the time
    it fetched the page because the page published no date, and such a source
    is never dated within 24 months. Never clear the flag to make a source look
    current. Set vendor_owned true
    only when an attributed source shows the competitor is owned by, or bundled
    into, a larger platform vendor rather than sold as an independent product;
    the competitive-room ladder scores on that flag, so a guess there moves the
    verdict. Set free_core_coverage for every competitor: WHOLE_JOB when
    an attributed source shows this competitor already does the whole scoped
    core job for the scoped user at no cost, MOST_OF_JOB when the free
    offering covers most of that job but not all of it, SEPARABLE_PART when
    it covers one part of it, and NONE when a source shows nothing here is
    free. Leave it null when no source settles the question; null is not
    NONE, and a guess is worse than a null. WHOLE_JOB is the single most
    consequential value in this branch - it is by itself enough to reject
    the idea - so set it only on an attributed source, never on a vendor
    page implying a free plan exists. A free product that competes with this
    idea is a competitor even when nobody sells it: record it here with its
    pricing as "free" rather than leaving it out. List in
    paying_segments each buyer segment an attributed source shows is already
    spending money on this problem, named as that source names it. Leave
    paying_segments empty when no source establishes one; a vendor's own
    marketing claim about who should buy is not a paying segment. If the tool
    status is not ok, return no sources, competitors or paying segments and
    name the missing evidence in
    gaps. Do not infer market size from an adjacent category. The cache block is
    evidence context, not a conclusion, and never replaces the required live
    tool call. Copy final source URLs only from the live tool result; the Flow
    retains cached passages separately.
  expected_output: >
    One JSON object matching MarketFindings exactly, with source_urls mirroring
    sources[].url in order and no prose or code fence.

sentiment_task:
  description: >
    Research direct user evidence for this approved scope:
    {scoped_idea_json}

    Call analyze_community_sentiment for each query below:
    {community_queries_block}

    Return one SentimentFindings JSON object. Keep at most one representative
    Thread per URL so source_urls remains unique. Preserve a short exact quote
    and classify it as HAS_PROBLEM, PAYS, BUILT_WORKAROUND, OPINION or OFF_TOPIC.
    Copy the story score into points and the story comment count into
    num_comments when the tool result reports them, and leave both null when it
    does not; never substitute a guess or a zero for a count the tool did not
    give you. Copy date and date_is_retrieval_time together: a true flag means
    the tool used the time it fetched the thread because the item carried no
    date of its own, and such a thread is never dated within 24 months. Never
    clear the flag to make a thread look recent. Upvotes and positive opinions do not establish demand. Every URL must be
    copied exactly from a tool result from this run. If no call succeeds, return
    no sources and explain the evidence gap. A tool result with status "empty" or result_count 0 is not an evidence gap yet; it
    usually means the query was too narrow. Before reporting a gap, call the tool again
    with a shorter query built from the two or three most important keywords, and try at
    most three such broadenings. Report the gap only if the broadest attempt is still
    empty, and name the queries you tried.
  expected_output: >
    One JSON object matching SentimentFindings exactly, with source_urls
    mirroring sources[].url in order and no prose or code fence.

feasibility_task:
  description: >
    Research technical feasibility for this approved scope:
    {scoped_idea_json}

    Supplemental dated cache evidence:
    {cached_evidence_block}

    Call assess_technical_feasibility for each query below:
    {tech_queries_block}

    Return one FeasibilityFindings JSON object. Keep at most one Repo per URL.
    Judge SOLVES_ENTIRELY, PARTIAL or IRRELEVANT from functional overlap; never
    use stars as a maturity, feasibility or saturation signal. Copy the licence flag from the
    tool result, and copy months_since_push exactly as the tool reports it,
    including null, which means GitHub reported no push date. Null is not zero
    and not "pushed recently": a repository whose months_since_push is null is
    never reusable and is never a live free substitute. Do not drop a
    repository or invent an age to avoid the null. Set archived from
    the tool result when it reports repository archive state and leave it null
    when it does not; an archived repository is not maintained, so it cannot
    be the free project that already solves the whole job. Every URL must be
    copied exactly from a tool result from this run. If no call succeeds, return
    no sources and explain the evidence gap. A tool result with status "empty" or result_count 0 is not an evidence gap yet; it
    usually means the query was too narrow. Before reporting a gap, call the tool again
    with a shorter query built from the two or three most important keywords, and try at
    most three such broadenings. Report the gap only if the broadest attempt is still
    empty, and name the queries you tried. The cache block is a rate-limit
    shock absorber and evidence context, not a conclusion; it never replaces
    the required live GitHub calls. Copy final source URLs only from live tool
    results; the Flow retains cached passages separately.
  expected_output: >
    One JSON object matching FeasibilityFindings exactly, with source_urls
    mirroring sources[].url in order and no prose or code fence.

synthesis_task:
  description: >
    Score the approved scope against the three evidence branches below.

    Approved scope:
    {scoped_idea_json}

    Market findings:
    {market_findings_json}

    Sentiment findings:
    {sentiment_findings_json}

    Feasibility findings:
    {feasibility_findings_json}

    A human may have requested this revision:
    {human_override}

    Return one Verdict JSON object. You supply the five anchored scores with
    their evidence URLs, the countable confidence inputs, the kill criteria and
    the cheapest next test.

    The schema recomputes and overwrites composite_score, confidence,
    confidence_band, verdict, decision_reason, fatal_floors and provisional.
    That arithmetic is not yours; anything you send for those fields is
    discarded. kill_criteria is the opposite: it is judgement, it is kept
    exactly as you write it, and nothing else in this system can produce it.
    Give 2 to 4 specific observations that would falsify this idea, each one
    something a person could go and check. Do not restate the fatal floors
    there; the schema derives those from the five scores by itself.

    Choose a score for each dimension and copy that dimension's anchor verbatim
    into anchor_matched. Copy it character for character: a guardrail compares
    what you wrote against the anchor for the score you claimed and rejects
    anything below 85% token overlap.

    Two rules govern every ladder. Score the HIGHEST level whose anchor is
    fully satisfied; an anchor beginning "Anchor N, and" adds its clause to
    anchor N. Partial satisfaction of anchor N scores N-1. Higher is always
    better on every dimension. Score 1 is reserved for evidence that does not
    reach the question and must never be reached by inference: weak evidence
    that exists is a 2, not a 1.

    A guardrail counts the findings and rejects a score the evidence cannot
    carry, so the anchor you quote has to be true of the lists above and not
    only of your reading of them. Scoring lower than the evidence supports is
    allowed everywhere except at 0 and 1, where a low score is itself a strong
    claim: 0 fires a floor and 1 says the branch found nothing. Do not reach
    for either to avoid a verdict you dislike; both are checked against the
    counts, in both directions.

    Score only on facts the findings carry, and never on popularity. A thread's
    points and comment count and a repository's star count say how visible
    something was, not that anyone has this problem or that the code is mature.
    Upvotes are not demand. The one place a repository's archived flag counts is
    the headroom ladder, where a null flag means "not reported" and never
    "confirmed still maintained".

    These terms mean exactly this, everywhere below:
      usable thread - a thread whose classification is not OFF_TOPIC.
      problem thread - a thread classified HAS_PROBLEM, PAYS or BUILT_WORKAROUND.
      reusable repository - a repository marked SOLVES_ENTIRELY or PARTIAL whose licence permits commercial use and whose months_since_push is 12 or fewer.
      free substitute - a repository marked SOLVES_ENTIRELY, which covers the whole core job on its own.
      free product - a named competitor whose free_core_coverage is WHOLE_JOB, MOST_OF_JOB or SEPARABLE_PART: a no-cost offering covering that much of the core job. A null free_core_coverage is not a free product and is not evidence that none exists, and neither is NONE a free product.
      covers the whole core job - free_core_coverage WHOLE_JOB. covers most of the core job - free_core_coverage MOST_OF_JOB, which means most of it but not all. covers a separable part - free_core_coverage SEPARABLE_PART.
      vendor owned - a competitor whose vendor_owned flag is true: owned by or bundled into a larger platform vendor rather than sold on its own.
      dated within 24 months - the source's own date is no more than 24 months before the scope's as_of date. A market source flagged dated_is_retrieval_time, or a thread flagged date_is_retrieval_time, carries no date of its own and is therefore never dated within 24 months however recent its timestamp looks.

    F and X read the same GitHub results and ask different questions. F counts
    reusable repositories, the components you build WITH. X asks whether one
    free thing is already a substitute for the whole product. Three libraries
    that each cover a separable part of the v1 are a high F and a high X at the
    same time; that is the intended reading, not a contradiction.

    D - Demand. Is anyone actively trying to solve this today?
      0: At least 3 usable threads, and none of them is a problem thread: nobody in the evidence describes having this problem.
      1: Evidence does not reach this question — the sentiment branch returned fewer than 3 usable threads and no problem thread.
      2: 1 or 2 problem threads, or at least 3 problem threads none of which is dated within 24 months.
      3: At least 3 problem threads, and at least 1 of them dated within 24 months.
      4: Anchor 3, and at least 1 problem thread is classified BUILT_WORKAROUND or PAYS.
      5: Anchor 4, and at least 5 problem threads are dated within 24 months, at least 2 of them classified BUILT_WORKAROUND or PAYS, and the market branch names at least 1 paying segment.

    M - Market. Is there money, and can you name whose?
      0: The market branch returned sources, and none of them names a buyer segment for this problem.
      1: Evidence does not reach this question — the market branch returned no source.
      2: At least 1 market source names a buyer segment for this problem.
      3: Anchor 2, and at least 1 source or competitor states a price or a budget that segment spends.
      4: Anchor 3, and at least 2 market sources dated within 24 months name that same segment.
      5: Anchor 4, and the market branch records that segment in paying_segments, supported by at least 3 sources dated within 24 months.

    C - Competitive room. Is the incumbent set beatable on a stated axis?
      0: At least 1 competitor is named, every named competitor is vendor owned, and no source states an axis on which any of them is beatable.
      1: Evidence does not reach this question — the market branch named no competitor.
      2: The named competitors include at least 1 that is not vendor owned, but no source states an axis of beatability.
      3: At least 1 source states an axis on which a named competitor is beatable.
      4: Anchor 3, and at least 2 competitors are named, and at least 1 source dated within 24 months describes a need the named incumbents do not serve.
      5: Anchor 4, and at least 2 sources dated within 24 months describe the same unserved need, and no named competitor is vendor owned.

    F - Feasibility. Can two or three engineers ship a v1?
      0: The feasibility branch returned repositories, and none of them is marked SOLVES_ENTIRELY or PARTIAL.
      1: Evidence does not reach this question — the feasibility branch returned no repository.
      2: At least 1 repository is marked SOLVES_ENTIRELY or PARTIAL, and none of them is reusable.
      3: At least 1 repository in the feasibility evidence is reusable: marked SOLVES_ENTIRELY or PARTIAL, licensed for commercial use, and pushed within 12 months.
      4: Anchor 3, and at least 2 reusable repositories are in the evidence.
      5: Anchor 4, and at least 3 reusable repositories together cover the separable parts of the scoped v1.

    X - Headroom over free. Is the core already free and good?
      0: At least 1 free substitute repository is not marked archived, permits commercial use and was pushed within 12 months, or at least 1 free product covers the whole core job.
      1: Evidence does not reach this question — no repository is marked SOLVES_ENTIRELY or PARTIAL and no free product is named.
      2: At least 1 free substitute repository exists, and every one of them is marked archived, licensed against commercial use, or was last pushed more than 12 months ago; or at least 1 free product covers most of the core job.
      3: No free substitute repository exists, and at least 1 free product is named, none covering more than a separable part of the core job.
      4: No free substitute and no free product, but a repository marked PARTIAL covers most of the core job.
      5: No free substitute and no free product, and every repository marked PARTIAL covers only a separable part of the core job, with at least 1 such repository in the evidence.

    The confidence inputs are counted, not judged, and a guardrail recomputes
    every one of them from the findings above and rejects a mismatch. Set
    market_coverage to min(1, market sources / 5), sentiment_coverage to min(1,
    threads classified HAS_PROBLEM, PAYS or BUILT_WORKAROUND / 5), and
    feasibility_coverage to min(1, repositories whose relevance is
    SOLVES_ENTIRELY or PARTIAL / 5). Set branches_ok to the number of findings
    with tool_status equal to ok. Set median_market_source_age_months to the
    median age in months of the market sources, ordering every source with no
    publication date of its own after all the dated ones, and set it to null
    whenever the middle of that ordering has no real publication date - which
    is the case unless strictly more than half of the market sources carry
    one. Undated material is never counted as fresh. Fill evidence_counts by counting the same lists.
  expected_output: >
    One JSON object matching Verdict exactly, with each evidence URL copied
    from the supplied findings and no prose or code fence.

reporting_task:
  description: >
    Write the final validation report from these inputs only.

    Approved scope:
    {scoped_idea_json}

    Market findings:
    {market_findings_json}

    Sentiment findings:
    {sentiment_findings_json}

    Feasibility findings:
    {feasibility_findings_json}

    Deterministic verdict:
    {verdict_json}

    Return one ValidationReport JSON object. markdown_body must be a useful
    Markdown decision brief with a title, summary, scope, five-score rubric,
    verdict and confidence shown separately, evidence gaps, a Risks section,
    kill criteria, cheapest next test and Sources.

    The Risks section states what could make this verdict wrong, drawn only
    from the inputs above: the verdict's fatal_floors, any dimension whose
    evidence_thin is true, any branch whose tool_status is not ok, the named
    evidence gaps, and specific hazards the sources themselves show such as an
    incumbent that already covers the job, a licence that forbids commercial
    use, or an archived or unmaintained repository. Cite each risk that rests
    on a source. Do not invent a risk the evidence does not support, and do not
    repeat the kill criteria there: a risk is what threatens the verdict, a
    kill criterion is the observation that would falsify the idea.

    Preserve every computed verdict field
    exactly. Cite every factual claim with an exact URL supplied above and cite
    every item in sources in markdown_body. Convert cited HN threads and GitHub
    repositories into Evidence entries without changing their URLs; use their
    quote or repository facts as claim, Hacker News or GitHub as publisher,
    their date or the scope as_of date as dated, and hn_algolia or github as
    retrieved_via. Do not add facts, names, numbers or URLs. When provisional is
    true, include the word Provisional in both the title and first summary line.
  expected_output: >
    One JSON object matching ValidationReport exactly. markdown_body contains
    the finished human-readable Markdown; do not wrap the JSON in a code fence.
  citation_guardrail: |-
    Reject the validation report unless BOTH rules hold:
      1. ATTRIBUTION - every factual, numeric, competitor, thread, repository and
         named-entity claim in markdown_body is attributable to a URL in the
         report's own sources list.
      2. FAITHFULNESS - markdown_body contains no fact, number, example or conclusion
         absent from the scoped idea, branch findings and deterministic verdict it
         was given.
    On rejection, name the failed rule and quote the exact unsupported sentence.
    Do not rewrite the report and do not judge style or persuasiveness. An honest
    statement that evidence is thin is a PASS.