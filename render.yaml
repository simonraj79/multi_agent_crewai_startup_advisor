# Render Blueprint - Validator Studio + Brief Crew (feature F44).
#
# Authoritative copy of the manifest specified in agents/07-deployment.md.
# Writing this file is NOT the same as applying it: creating the Blueprint,
# and therefore the two web services, is still a deliberate manual step.
#
# Corrections against the block previously printed in 07-deployment.md:
#   * postgresMajorVersion is "18", not "17" - the live instance
#     the live instance was upgraded and reports PG 18.
#   * startCommand targets brief_crew.service.app:create_app as a FACTORY.
#     There is no `app.main` module in this repository.
#   * buildCommand installs the `service` optional extra. A bare `uv sync`
#     resolves without fastapi / sqlalchemy / psycopg and the process dies at
#     import with ServiceDependencyError.
#   * The frontend reads VITE_API_URL (see frontend/src/services/studioApi.ts),
#     not VITE_API_BASE_URL, and it needs a full origin including the scheme.

databases:
  - name: agentic-crew-ai-db
    # Live resource: created by hand outside this Blueprint - check the apply
    # preview LINKS it rather than proposing a second instance.
    # These values mirror it exactly so an apply does not try to redefine it.
    databaseName: agentic_crew_ai_db
    user: agentic_crew_ai_db_user
    plan: basic_256mb
    region: singapore
    diskSizeGB: 1
    postgresMajorVersion: "18"
    # ipAllowList is deliberately omitted, but NOT for the reason this comment
    # used to give. It claimed the live database "already has an allow list"
    # that an apply would overwrite. Queried against the Render API on
    # 2026-08-30, `ipAllowList` on dpg-…-a is `[]` - empty. On Render an empty
    # allow list means no external connections at all: only traffic from inside
    # the same region reaches it.
    #
    # That is the safe state, and omitting the key preserves it. Two
    # consequences follow, and both are load-bearing:
    #   1. DATABASE_URL must be the INTERNAL connection string. An external one
    #      is refused, and the failure surfaces at /readyz, not at startup.
    #   2. The API service must stay in `singapore`. Move it and the database
    #      becomes unreachable with no configuration change to blame.

services:
  # --------------------------------------------------------------------------
  # Backend - FastAPI + WebSocket service (src/brief_crew/service/)
  # --------------------------------------------------------------------------
  - name: agentic-crew-ai-api
    type: web
    runtime: python
    plan: starter
    region: singapore

    # Render auto-detects uv.lock at the repo root and installs uv.
    # `--frozen` installs exactly what the lockfile pins, with no re-resolution.
    # `--extra service` is mandatory: fastapi, sqlalchemy and psycopg[binary]
    # live in [project.optional-dependencies].service in pyproject.toml.
    buildCommand: "uv sync --frozen --extra service"

    # The ASGI entry point is a factory, so --factory is required.
    # `--no-sync` stops uv from re-syncing (and thereby dropping the `service`
    # extra) at boot; the build step already produced .venv.
    startCommand: "uv run --no-sync uvicorn brief_crew.service.app:create_app --factory --host 0.0.0.0 --port $PORT"

    healthCheckPath: /healthz

    # 300s is Render's ceiling and the correct choice here, not a comfortable
    # margin. On SIGTERM the FastAPI lifespan calls RunRegistry.close(), which
    # does executor.shutdown(wait=True, cancel_futures=True): queued runs are
    # cancelled but an ALREADY EXECUTING CrewAI step is waited on, and a full
    # six-agent validator run can exceed five minutes. Frame flushing itself is
    # cheap (bounded queue drain plus a 5s writer-thread join). A redeploy
    # during an active run can still be SIGKILLed mid-flight; durable
    # persistence plus resume is the mitigation, not this number.
    maxShutdownDelaySeconds: 300

    envVars:
      # crewai declares requires-python <3.14. Services created after Feb 2026
      # default to 3.14, which WOULD fail the build. .python-version pins 3.13
      # as well; this is the belt to that pair of braces.
      - key: PYTHON_VERSION
        value: "3.13"

      - key: DATABASE_URL
        fromDatabase:
          name: agentic-crew-ai-db
          property: connectionString

      # One concurrent run is the memory ceiling on a 512 MB starter instance
      # (~210 MB baseline per run). Matches the code default in config.py.
      - key: RUN_CONCURRENCY
        value: "1"

      # The studio is a SEPARATE origin, so every request the Vue app makes is
      # cross-origin and the browser drops the response unless this names it.
      # Locally the Vite proxy makes everything same-origin, which is why an
      # empty default is correct there and fatal here. Scheme + host, no
      # trailing slash - startup refuses a malformed entry and names the
      # corrected string.
      #
      # ⚠️ THIS LITERAL, `AUTH_BASE_URL` BELOW AND `VITE_API_URL` ON THE STUDIO
      # ARE THREE COPIES OF TWO URLS THAT DO NOT EXIST UNTIL THE APPLY CREATES
      # THE SERVICES. Render derives a service's hostname from its `name`, and
      # `name` is declared right here - so the values are *predictable*, which
      # is why they are literals rather than `sync: false` (that was tried on
      # VITE_API_URL, the manual step was missed, and production shipped a
      # console talking to itself). Predictable is not guaranteed: if either
      # `name` is already taken in the account, Render appends a suffix and all
      # three literals are silently wrong.
      #
      # There is NO manifest expression for this. `fromService … property: host`
      # yields a bare hostname with no scheme, and a scheme-less value is the
      # exact broken case all three of these keys warn about. So it is a manual
      # CHECK, and it belongs at one specific moment:
      #
      #   ON THE APPLY PREVIEW, BEFORE APPLYING, read the URLs Render proposes
      #   for `agentic-crew-ai-api` and `agentic-crew-ai-studio`. If either
      #   differs from the literals here, fix all three keys, push, and
      #   re-preview. Do not apply and patch afterwards: Render snapshots a
      #   deploy's environment when the deploy is CREATED (deployment trap 3),
      #   and VITE_API_URL is inlined at BUILD time, so a later edit needs a
      #   fresh deploy of the studio and not a restart.
      #
      # The failure this prevents is silent in both directions: a wrong
      # CORS_ALLOW_ORIGINS fails CLOSED and reads as missing middleware, and a
      # wrong VITE_API_URL makes the console fall back to its fabricated demo.
      # docs/deploying.md step 3a is the same check as a runbook line.
      - key: CORS_ALLOW_ORIGINS
        value: "https://agentic-crew-ai-studio.onrender.com"

      # The origin of the Better Auth service - the SAME value the web service
      # sets as BETTER_AUTH_URL, and the same one CORS_ALLOW_ORIGINS names
      # above, because the SPA and auth share an origin by design.
      #
      # Setting this is what TURNS AUTHENTICATION ON. `VALIDATOR_REQUIRE_AUTH`
      # defaults to "true when an auth server is configured" rather than to a
      # flat false, so there is no state where this is set and the API still
      # serves anonymous callers - see config.py. It is three things at once
      # here as well: the JWKS location, the expected `iss`, and the expected
      # `aud`.
      - key: AUTH_BASE_URL
        value: "https://agentic-crew-ai-studio.onrender.com"

      # DELIBERATELY UNSET: VALIDATOR_ALLOW_AUTO_GATES.
      #
      # Not an oversight, and not the same thing as "unattended runs are off".
      # `create_run` permits `gates: "auto"` for any AUTHENTICATED caller; this
      # flag only governs ANONYMOUS ones. Since AUTH_BASE_URL above turns
      # authentication on for every paid endpoint, there are no anonymous
      # callers here and the flag has nothing left to decide.
      #
      # Setting it to "true" would therefore change nothing today - and would
      # become a real hole the moment authentication were disabled, which is
      # exactly when nobody would think to look at it. Leaving it unset means
      # the anonymous case fails closed on its own.
      #
      # What actually bounds an unattended run is MAX_RUN_COST_USD (default
      # $10), enforced at the CrewAI step boundary by HookAborted, plus the
      # per-user rate limit and MAX_QUEUED_RUNS.

      - key: CREWAI_DISABLE_TELEMETRY
        value: "true"

      # ON, and deliberately different from the Dockerfile's `false`. This is
      # NOT an inversion, though it has been read as one: the two paths choose
      # different MODES, and agents/08-observability.md:196 prescribes exactly
      # this split.
      #
      #   here (Render)  true  -> EPHEMERAL tracing. Unauthenticated, short-lived
      #                           trace links, not attributed to the AMP org.
      #                           That is the documented Render answer, and
      #                           CLAUDE.md's next-step plan calls for a paid
      #                           acceptance run "with traces enabled".
      #   Dockerfile     false -> off entirely, because the AUTHENTICATED
      #                           credential (tokens.enc) is a secret that
      #                           expires and must never be baked into an image.
      #
      # The credential is written by an interactive `crewai login` and has no
      # env-var equivalent, which is why neither path can be authenticated.
      # Postgres `run_metrics` remains the durable record either way.
      - key: CREWAI_TRACING_ENABLED
        value: "true"

      # Pin it; otherwise CrewAI derives the storage directory from the CWD name.
      - key: CREWAI_STORAGE_DIR
        value: "/tmp/crewai"

      - key: PINECONE_INDEX_NAME
        value: agentic-crew-ai-index

      # ⚠️ REQUIRED SINCE PLAN 01, AND ITS ABSENCE IS NOT A DEGRADED FEATURE -
      # THE PROCESS DOES NOT START. `_assert_credential_vault_startup_safety`
      # runs inside `create_app` (service/app.py, called at :673, before any
      # route is mounted) and raises when AUTH_BASE_URL is set and this is
      # empty: a deployment that can sign people in and has nowhere to keep
      # their API keys is misconfigured, and it fails loud rather than serving
      # a vault-shaped hole. AUTH_BASE_URL is set above, so this is mandatory
      # here. Measured 2026-09-04 at `bc12642` by building the app with exactly
      # this environment: RuntimeError, not a 503.
      #
      # Base64 of 32 random bytes - the AES-256-GCM master key for the per-user
      # credential vault. Mint one, once, and never rotate it casually: every
      # stored credential is encrypted under it and a changed key is detected
      # and refused, not silently re-wrapped.
      #
      #   python -c "import base64, secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())"
      #
      # `sync: false` like every other secret. NOTE for an EXISTING Blueprint:
      # Render prompts for sync:false values at Blueprint CREATION, so adding
      # this key to an already-applied Blueprint means entering it in the
      # dashboard before the next deploy - a deploy that reaches this code
      # without it will fail its health check and roll back.
      - key: CREDENTIALS_MASTER_KEY
        sync: false

      # PLANS.md decision 9, ruled ON 2026-09-05: the platform Firecrawl key
      # backs every user's research tools, bounded by
      # BUILDER_PLATFORM_FIRECRAWL_DAILY_CAP (default 50 per user per UTC day)
      # and overridden by a user's own credential. Set here so a fresh apply
      # matches the dashboard, where it was set through the API that day.
      - key: BUILDER_PLATFORM_FIRECRAWL_DEFAULT
        value: "1"

      # Every credential is `sync: false`: the value is never committed. Render
      # prompts once at Blueprint creation and stores it as a dashboard secret.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      # Optional. Absent, GitHub repository search is rate limited to 8
      # requests/min; present, 24/min (PRD R-7, config.py
      # VALIDATOR_GITHUB_RATE_LIMIT_UNAUTH / _AUTHED). Leave it blank at the
      # prompt to run unauthenticated.
      - key: GITHUB_TOKEN
        sync: false

      # ------------------------------------------------------------------
      # Langfuse - one trace per run, one generation per LLM call.
      #
      # THESE THREE KEYS ARE THE WHOLE SWITCH. There is no fourth key that
      # turns the exporter on: `LANGFUSE_EXPORT_ENABLED` defaults to
      # `bool(public and secret)` (config.py), the same derived shape as
      # `VALIDATOR_REQUIRE_AUTH` above - configuring the destination IS
      # turning it on, so the half-configured state does not exist and there
      # is no boolean anyone can forget. Set it explicitly to `0` only to
      # leave the keys in place with export suspended.
      #
      # Their ABSENCE is a supported state, and this is the opposite of
      # CREDENTIALS_MASTER_KEY above. With either key missing `build_exporter`
      # returns a no-op that logs one line at startup and does nothing else:
      # it never raises, never joins a boot assertion and cannot fail a health
      # check. Telemetry being off must never become "the run failed". So a
      # fresh apply that skips these prompts still boots; it just writes no
      # trace. `GET /readyz` carries an `observability` object saying which of
      # the two it is - deliberately WITHOUT the base URL or either key, since
      # /readyz is unauthenticated.
      #
      # ⚠️ LANGFUSE_CAPTURE_CONTENT IS DELIBERATELY UNSET AND MUST STAY UNSET
      # HERE. Its default is `0`, and `0` is the only value for a public
      # deployment. Off, a generation carries a SHA-256 fingerprint of the
      # rendered prompt plus message and character counts - enough to answer
      # *which* prompt, with no text. On, completions, tool arguments and tool
      # results leave the process for a third-party console whose share URL is
      # one paste away from a user's idea. Every outbound string is scrubbed
      # either way, but a scrub is a denylist and the default is not.
      #
      # Both keys are credentials, hence `sync: false` like every other one.
      # The Langfuse PUBLIC key is a credential too, whatever its name says -
      # it is half of the Basic-auth pair and Langfuse's own API echoes it
      # back on every object it serves (gotchas 60), so it never becomes a
      # literal here. The base URL is not a secret and is a literal, in the
      # same spirit as CORS_ALLOW_ORIGINS: a value that is knowable when this
      # file is written should not be a manual step that can be missed.
      #
      # Set on the live service through the Render API on 2026-09-06 and
      # recorded here so a fresh apply matches the dashboard, exactly as
      # BUILDER_PLATFORM_FIRECRAWL_DEFAULT above says of itself. NOTE for the
      # already-applied Blueprint: Render prompts for `sync: false` values at
      # Blueprint CREATION only, and it snapshots a deploy's environment when
      # the deploy is CREATED (deployment trap 3) - so entering these in the
      # dashboard is not enough on its own; they reach the process only on the
      # NEXT deploy, which is what the commit carrying this block triggers.
      #
      # The knobs not named here - export enabled, capture content,
      # environment, billed-cost resolution and the seven bounds - are all
      # left to their defaults on purpose; docs/deploying.md's observability
      # table has a row per knob and docs/observability/TRACE-CONTRACT.md §9
      # is the contract.
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: "https://us.cloud.langfuse.com"

  # --------------------------------------------------------------------------
  # Frontend + auth - Vue 3 SPA served by a Node server (frontend/)
  #
  # THIS WAS A `runtime: static` SITE AND IS NOW A NODE WEB SERVICE. The change
  # is forced by Better Auth, which is a TypeScript library needing a Node
  # runtime; a CDN cannot run one. Two consequences follow and both are
  # load-bearing:
  #
  #   1. `region: singapore` is now MANDATORY, where before there was
  #      deliberately no region at all. This service writes sessions to the
  #      database, and that database declares `ipAllowList: []` - only traffic
  #      from inside the same region reaches it. Move this service and logins
  #      break with no configuration change to blame, exactly as the API would.
  #   2. The SPA and auth share ONE ORIGIN, and that is the whole design.
  #      `onrender.com` is on the Public Suffix List, so a browser refuses to
  #      set a cookie scoped to `.onrender.com` - a separate auth subdomain
  #      could never share a session cookie with the SPA. Same origin makes an
  #      ordinary httpOnly cookie work and keeps the session out of JavaScript.
  #
  # The FastAPI service is still a different origin and still cannot read that
  # cookie. The SPA fetches a 15-minute JWT from this service and sends it there
  # as a bearer token; see src/brief_crew/service/auth.py.
  # --------------------------------------------------------------------------
  - name: agentic-crew-ai-studio
    type: web
    runtime: node
    # See note 1 above - this is not a preference.
    region: singapore
    # `free` spins down after inactivity, so the first visitor of the day waits
    # for a cold start ON THE SIGN-IN PAGE, which is the worst possible place to
    # put a 30-second pause. It also delays the API's first JWKS fetch. Move to
    # `starter` if this is shown to anyone; the code is identical either way.
    plan: free
    rootDir: frontend
    # `npm run build` is three steps: vue-tsc -b (which type-checks src, tests,
    # e2e AND server via project references), vite build (the SPA into dist/),
    # then tsc -p tsconfig.server.json (the Node server into server-dist/).
    #
    # `--include=dev` IS LOAD-BEARING, and a bare `npm ci` here fails the build.
    # NODE_ENV is set to `production` below - which this service genuinely needs
    # at RUNTIME, because frontend/server/auth.ts reads it to decide
    # `useSecureCookies`. But npm also reads NODE_ENV, and at `production` it
    # OMITS devDependencies. All three build tools - vue-tsc, vite and
    # typescript - are devDependencies, so the install quietly succeeds with
    # 196 packages instead of ~400 and the build dies on:
    #
    #     sh: 1: vue-tsc: not found
    #
    # Measured, not theorised: this is exactly how the first deploy of this
    # service failed. Dropping NODE_ENV would "fix" the build and ship a
    # Secure-less session cookie to production, so the install is made explicit
    # instead.
    buildCommand: "npm ci --include=dev && npm run build"
    # The Better Auth schema is migrated IN-PROCESS at startup
    # (frontend/server/migrate.ts), not here. A build container is not
    # guaranteed to reach a database whose ipAllowList is empty, and a
    # migration that quietly did not run surfaces as "no such table:
    # session" on the first sign-in rather than as a failed deploy.
    startCommand: "npm start"
    healthCheckPath: /healthz
    envVars:
      # Better Auth's tables (user, session, account, verification, jwks) live
      # in the SAME database as the runs, which is what lets the API resolve a
      # run's owner without a second datastore. Internal connection string, for
      # the ipAllowList reason above.
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-crew-ai-db
          property: connectionString

      # Signs session cookies AND encrypts the private half of the JWKS key at
      # rest. Rotating it invalidates every session and every issued JWT, so
      # generate once and leave it: `openssl rand -base64 32`.
      - key: BETTER_AUTH_SECRET
        sync: false

      # The origin the BROWSER sees, scheme included and no trailing slash. It
      # is three things at once - the OAuth redirect base, the cookie origin,
      # and the `iss`/`aud` of every JWT - so a wrong value here fails in three
      # different-looking ways. It must equal this service's own URL, and it
      # must equal AUTH_BASE_URL on the API. `sync: false` for the same reason
      # CORS_ALLOW_ORIGINS is a literal: the URL does not exist until the
      # service does.
      - key: BETTER_AUTH_URL
        sync: false

      # From the Google Cloud console - see docs/google-oauth.md. The authorised
      # redirect URI registered there must be exactly
      #   ${BETTER_AUTH_URL}/api/auth/callback/google
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Turns on Secure cookies and switches off the dev-only trusted origins.
      - key: NODE_ENV
        value: production

      # Pin the toolchain for the build that SHIPS. CI pins Node 24
      # (.github/workflows/ci.yml), but this build pinned nothing - no
      # NODE_VERSION, no engines.node, no .nvmrc - so it ran on whatever
      # Render's platform default happened to be on the day. vite@8 requires
      # ^20.19.0 || >=22.12.0, so the floor is real and a platform default
      # drifting below it fails the deploy, not the tests.
      #
      # This is deployment trap 4 one layer up: the build environment that
      # ships is the one verified least. Keep this in step with ci.yml.
      - key: NODE_VERSION
        value: "24"

      # Read by frontend/src/services/studioApi.ts. It is used both as a fetch
      # prefix AND as the base of `new URL(...)` for the WebSocket, so it MUST
      # be a full origin with a scheme, e.g.
      #   https://agentic-crew-ai-api.onrender.com
      # `fromService ... property: host` yields a bare hostname, which resolves
      # as a relative path and breaks the /ws connection - hence sync: false,
      # filled in once the API's real URL is known.
      #
      # ⚠️ SET EXPLICITLY 2026-09-01, after this being unset broke production.
      #
      # `sync: false` meant "fill this in by hand once the API's URL is known",
      # and on the live studio service it was never filled in. Vite INLINES
      # this at build time, so an empty value ships a bundle whose `baseUrl` is
      # '' - every API call then resolves against the studio's own origin, hits
      # the SPA history fallback, and comes back 200 text/html. Measured on the
      # deployed site: `GET https://agentic-crew-ai-studio.onrender.com/api/
      # workflows` -> 200 HTML, and the console fell back to its scripted demo.
      #
      # The API's URL is knowable when this file is written - AUTH_BASE_URL
      # above is hardcoded for exactly the same reason - so hardcoding removes
      # a manual step that had already been missed once. If the API is ever
      # renamed, this and AUTH_BASE_URL move together.
      #
      # It must be a full origin WITH a scheme: it is used both as a fetch
      # prefix and as the base of `new URL(...)` for the WebSocket, so
      # `fromService ... property: host` (a bare hostname) would resolve as a
      # relative path and break /ws.
      - key: VITE_API_URL
        value: "https://agentic-crew-ai-api.onrender.com"
    # No `routes:` block any more. SPA fallback was a static-site rewrite rule;
    # it is now `app.get("*", ...)` in frontend/server/index.ts, which has to
    # own it anyway so that /api/auth/* is matched BEFORE the fallback.
